services:
  termini_api:
    build:
      context: .
      dockerfile: Termini_Api/Dockerfile
    depends_on:
      - postgres
    environment:
      ConnectionStrings__DBConnection: "Host=postgres;Database=TerminiDB;Username=postgres;Password=l520djordje"
    ports:
      - "8080:8080"
      - "8081:8081"

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: l520djordje
      POSTGRES_DB: TerminiDB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
